name: Build and publish wiki

on:
  workflow_call:
    inputs:
      vendor:
        required: true
        type: string
      vendor_name:
        required: true
        type: string
      product:
        required: true
        type: string
      product_name:
        required: true
        type: string
      content_path:
        required: false
        type: string
        default: "docs"
      registry_url:
        required: false
        type: string
        default: "https://wiki.tailstory.dev/api/registry"
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_BUCKET:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      WIKI_REGISTRY_TOKEN:
        required: true

permissions: {}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tailstory-wiki/builder
          ref: main
          path: builder
          persist-credentials: false

      - name: Check out content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: content
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: builder/package-lock.json

      - name: Install dependencies
        working-directory: builder
        run: npm ci

      - name: Link layouts into content
        run: ln -s "$GITHUB_WORKSPACE/builder/_includes" "$GITHUB_WORKSPACE/content/${{ inputs.content_path }}/_includes"

      - name: Run Eleventy
        working-directory: builder
        env:
          WIKI_INPUT_DIR: ${{ github.workspace }}/content/${{ inputs.content_path }}
          WIKI_OUTPUT_DIR: ${{ github.workspace }}/_site
          WIKI_DOCS_REPO: ${{ github.repository }}
          WIKI_DOCS_REF: ${{ github.ref_name }}
          WIKI_DOCS_PATH: ${{ inputs.content_path }}
          WIKI_VENDOR: ${{ inputs.vendor }}
          WIKI_PRODUCT: ${{ inputs.product }}
        run: npx eleventy

      - name: Build TOCs
        working-directory: builder
        env:
          CONTENT_DIR: ${{ github.workspace }}/content/${{ inputs.content_path }}
          OUT_DIR: ${{ github.workspace }}/_site
          SCHEMA: ${{ github.workspace }}/builder/toc-schema.json
        run: npm run build:tocs

      - name: Build links
        working-directory: builder
        env:
          CONTENT_DIR: ${{ github.workspace }}/content/${{ inputs.content_path }}
          OUT_DIR: ${{ github.workspace }}/_site
          SCHEMA: ${{ github.workspace }}/builder/links-schema.json
        run: npm run build:links

      - name: Build raw markdown
        working-directory: builder
        env:
          CONTENT_DIR: ${{ github.workspace }}/content/${{ inputs.content_path }}
          OUT_DIR: ${{ github.workspace }}/_site
        run: npm run build:raw

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to R2
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site/

      - name: Sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VENDOR: ${{ inputs.vendor }}
          PRODUCT: ${{ inputs.product }}
        run: |
          aws s3 sync _site/ s3://$R2_BUCKET/$VENDOR/$PRODUCT/ \
            --endpoint-url https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com \
            --delete

  register:
    name: Register vendor/product
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: POST to /api/registry
        env:
          REGISTRY_URL: ${{ inputs.registry_url }}
          REGISTRY_TOKEN: ${{ secrets.WIKI_REGISTRY_TOKEN }}
          VENDOR_SLUG: ${{ inputs.vendor }}
          VENDOR_NAME: ${{ inputs.vendor_name }}
          PRODUCT_SLUG: ${{ inputs.product }}
          PRODUCT_NAME: ${{ inputs.product_name }}
        run: |
          payload=$(jq -nc \
            --arg vs "$VENDOR_SLUG" \
            --arg vn "$VENDOR_NAME" \
            --arg ps "$PRODUCT_SLUG" \
            --arg pn "$PRODUCT_NAME" \
            '{vendor: {slug: $vs, name: $vn}, product: {slug: $ps, name: $pn}}')
          status=$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST "$REGISTRY_URL" \
            -H "Authorization: Bearer $REGISTRY_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw "$payload")
          echo "HTTP $status"
          cat response.txt
          test "$status" = "200"
